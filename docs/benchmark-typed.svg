<rect class="bg" x="0" y="0" width="920" height="458" rx="10"/>
<text x="40.0" y="44.0" class="title" text-anchor="start">Typed serialization: TOML to native types and back</text>
<text x="40.0" y="66.0" class="subtitle" text-anchor="start">typed.toml, 3.8 MB: 20,000 [[servers]], each with a nested table · ms per operation, lower is better · every library binds the same values</text>
<text x="40.0" y="96.0" class="group" text-anchor="start">READ · text → objects</text>
<text x="242" y="120.0" class="small" text-anchor="end"><tspan class="libname">glaze</tspan><tspan class="lang" dx="5">C++</tspan></text>
<rect x="250" y="110.0" width="5.5" height="12" rx="2" class="bar"/>
<text x="261.5" y="120.0" class="small"><tspan class="value">16.1</tspan><tspan class="note-plain" dx="6">2.5× faster</tspan></text>
<text x="242" y="140.0" class="small" text-anchor="end"><tspan class="libname">toml-spanner</tspan><tspan class="lang" dx="5">Rust</tspan></text>
<rect x="250" y="130.0" width="7.1" height="12" rx="2" class="bar"/>
<text x="263.1" y="140.0" class="small"><tspan class="value">20.8</tspan><tspan class="note-plain" dx="6">1.9× faster</tspan></text>
<text x="242" y="160.0" class="small" text-anchor="end"><tspan class="libname ours">TomlBeef (no positions)</tspan><tspan class="lang" dx="5">Beef</tspan></text>
<rect x="250" y="150.0" width="11.6" height="12" rx="2" class="bar-ours"/>
<text x="267.6" y="160.0" class="small"><tspan class="value ours">34.0</tspan><tspan class="note-plain" dx="6">1.2× faster</tspan></text>
<text x="242" y="180.0" class="small" text-anchor="end"><tspan class="libname ours">TomlBeef (arena)</tspan><tspan class="lang" dx="5">Beef</tspan></text>
<rect x="250" y="170.0" width="12.7" height="12" rx="2" class="bar-ours"/>
<text x="268.7" y="180.0" class="small"><tspan class="value ours">37.3</tspan><tspan class="note-plain" dx="6">1.1× faster</tspan></text>
<text x="242" y="200.0" class="small" text-anchor="end"><tspan class="libname">zig-toml</tspan><tspan class="lang" dx="5">Zig</tspan></text>
<rect x="250" y="190.0" width="13.2" height="12" rx="2" class="bar"/>
<text x="269.2" y="200.0" class="small"><tspan class="value">38.9</tspan><tspan class="note-plain" dx="6">≈</tspan></text>
<text x="242" y="220.0" class="small" text-anchor="end"><tspan class="libname ours">TomlBeef</tspan><tspan class="lang" dx="5">Beef</tspan></text>
<rect x="250" y="210.0" width="13.5" height="12" rx="2" class="bar-ours"/>
<text x="269.5" y="220.0" class="small"><tspan class="value ours">39.8</tspan><tspan class="note-plain" dx="6"></tspan></text>
<text x="242" y="240.0" class="small" text-anchor="end"><tspan class="libname">go-toml</tspan><tspan class="lang" dx="5">Go</tspan></text>
<rect x="250" y="230.0" width="18.8" height="12" rx="2" class="bar"/>
<text x="274.8" y="240.0" class="small"><tspan class="value">55.5</tspan><tspan class="note-plain" dx="6">1.4× slower</tspan></text>
<text x="242" y="260.0" class="small" text-anchor="end"><tspan class="libname">toml (Rust)</tspan><tspan class="lang" dx="5">Rust</tspan></text>
<rect x="250" y="250.0" width="26.6" height="12" rx="2" class="bar"/>
<text x="282.6" y="260.0" class="small"><tspan class="value">78.3</tspan><tspan class="note-plain" dx="6">2.0× slower</tspan></text>
<text x="242" y="280.0" class="small" text-anchor="end"><tspan class="libname">Tomlyn (source generator)</tspan><tspan class="lang" dx="5">C#</tspan></text>
<rect x="250" y="270.0" width="42.3" height="12" rx="2" class="bar"/>
<text x="298.3" y="280.0" class="small"><tspan class="value">124.4</tspan><tspan class="note-plain" dx="6">3.1× slower</tspan></text>
<text x="242" y="300.0" class="small" text-anchor="end"><tspan class="libname">Tomlyn (reflection)</tspan><tspan class="lang" dx="5">C#</tspan></text>
<rect x="250" y="290.0" width="46.3" height="12" rx="2" class="bar"/>
<text x="302.3" y="300.0" class="small"><tspan class="value">136.2</tspan><tspan class="note-plain" dx="6">3.4× slower</tspan></text>
<text x="242" y="320.0" class="small" text-anchor="end"><tspan class="libname">BurntSushi</tspan><tspan class="lang" dx="5">Go</tspan></text>
<rect x="250" y="310.0" width="100.0" height="12" rx="2" class="bar"/>
<text x="356.0" y="320.0" class="small"><tspan class="value">294.3</tspan><tspan class="note-plain" dx="6">7.4× slower</tspan></text>
<text x="480.0" y="96.0" class="group" text-anchor="start">WRITE · objects → text</text>
<text x="682" y="120.0" class="small" text-anchor="end"><tspan class="libname">glaze</tspan><tspan class="lang" dx="5">C++</tspan></text>
<rect x="690" y="110.0" width="2.0" height="12" rx="2" class="bar"/>
<text x="698.0" y="120.0" class="small"><tspan class="value">3.7</tspan><tspan class="note-plain" dx="6">6.3× faster</tspan></text>
<text x="682" y="140.0" class="small" text-anchor="end"><tspan class="libname">toml-spanner</tspan><tspan class="lang" dx="5">Rust</tspan></text>
<rect x="690" y="130.0" width="6.1" height="12" rx="2" class="bar"/>
<text x="702.1" y="140.0" class="small"><tspan class="value">12.3</tspan><tspan class="note-plain" dx="6">1.9× faster</tspan></text>
<text x="682" y="160.0" class="small" text-anchor="end"><tspan class="libname ours">TomlBeef</tspan><tspan class="lang" dx="5">Beef</tspan></text>
<rect x="690" y="150.0" width="11.7" height="12" rx="2" class="bar-ours"/>
<text x="707.7" y="160.0" class="small"><tspan class="value ours">23.5</tspan><tspan class="note-plain" dx="6"></tspan></text>
<text x="682" y="180.0" class="small" text-anchor="end"><tspan class="libname">toml (Rust)</tspan><tspan class="lang" dx="5">Rust</tspan></text>
<rect x="690" y="170.0" width="14.2" height="12" rx="2" class="bar"/>
<text x="710.2" y="180.0" class="small"><tspan class="value">28.5</tspan><tspan class="note-plain" dx="6">1.2× slower</tspan></text>
<text x="682" y="200.0" class="small" text-anchor="end"><tspan class="libname">go-toml</tspan><tspan class="lang" dx="5">Go</tspan></text>
<rect x="690" y="190.0" width="15.2" height="12" rx="2" class="bar"/>
<text x="711.2" y="200.0" class="small"><tspan class="value">30.3</tspan><tspan class="note-plain" dx="6">1.3× slower</tspan></text>
<text x="682" y="220.0" class="small" text-anchor="end"><tspan class="libname">Tomlyn (source generator)</tspan><tspan class="lang" dx="5">C#</tspan></text>
<rect x="690" y="210.0" width="23.9" height="12" rx="2" class="bar"/>
<text x="719.9" y="220.0" class="small"><tspan class="value">47.8</tspan><tspan class="note-plain" dx="6">2.0× slower</tspan></text>
<text x="682" y="240.0" class="small" text-anchor="end"><tspan class="libname">Tomlyn (reflection)</tspan><tspan class="lang" dx="5">C#</tspan></text>
<rect x="690" y="230.0" width="37.8" height="12" rx="2" class="bar"/>
<text x="733.8" y="240.0" class="small"><tspan class="value">75.6</tspan><tspan class="note-plain" dx="6">3.2× slower</tspan></text>
<text x="682" y="260.0" class="small" text-anchor="end"><tspan class="libname">BurntSushi</tspan><tspan class="lang" dx="5">Go</tspan></text>
<rect x="690" y="250.0" width="100.0" height="12" rx="2" class="bar"/>
<text x="796.0" y="260.0" class="small"><tspan class="value">200.0</tspan><tspan class="note-plain" dx="6">8.5× slower</tspan></text>
<text x="682" y="280.0" class="small" text-anchor="end"><tspan class="libname">zig-toml</tspan><tspan class="lang" dx="5">Zig</tspan></text>
<text x="692.0" y="280.0" class="cell-missing" text-anchor="start">cannot write an array of tables</text>
<text x="40.0" y="342.0" class="footnote" text-anchor="start">TomlBeef: TomlSerializer.Read records source positions for located errors; "no positions" is doc.Read + doc.Deserialize,</text>
<text x="40.0" y="360.0" class="footnote" text-anchor="start">and "arena" reads through a scope BumpAllocator. glaze and toml-spanner bind while parsing; TomlBeef parses into a document</text>
<text x="40.0" y="378.0" class="footnote" text-anchor="start">first, so typed sections and hand-written data can share one document.</text>
<text x="40.0" y="396.0" class="footnote" text-anchor="start">Mappings: glaze compile-time reflection, toml-spanner and serde derive, zig-toml comptime reflection, Go struct tags, Tomlyn</text>
<text x="40.0" y="414.0" class="footnote" text-anchor="start">a source generator or reflection. Validation differs: glaze skips UTF-8 checks, zig-toml accepts invalid TOML.</text>
<text x="40.0" y="442.0" class="footer" text-anchor="start">Linux x86-64, single thread · 1 s warm-up, samples until 60% are within ±10% of their median · median of 3 processes · typed.sh</text>
</svg>
