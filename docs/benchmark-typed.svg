    .cell-missing { font-size: 10px; fill: #8c959f; }
    .heat { fill: #2da44e; }
    .row-ours { fill: #ea580c; fill-opacity: 0.07; }
    .seg-ok { fill: #2da44e; }
    .seg-approx { fill: #d4a72c; }
    .seg-bad { fill: #cf222e; }
    .seg-err { fill: #afb8c1; }
    @media (prefers-color-scheme: dark) {
