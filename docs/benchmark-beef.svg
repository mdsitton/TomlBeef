<rect class="bg" x="0" y="0" width="920" height="1268" rx="10"/>
<text x="40.0" y="44.0" class="title" text-anchor="start">TomlBeef and Beef's built-in TOML reader</text>
<text x="40.0" y="66.0" class="subtitle" text-anchor="start">Beefy.utils.StructuredData, which the Beef IDE and BeefBuild use for project files, built into one program with TomlBeef</text>
<text x="40.0" y="106.0" class="group" text-anchor="start">READS TOML CORRECTLY</text>
<line x1="40" y1="120.0" x2="880" y2="120.0" class="rule"/>
<text x="180.0" y="142.0" class="label" text-anchor="end">toml-test valid files</text>
<text x="180.0" y="157.0" class="note-plain small" text-anchor="end">266 files</text>
<rect x="200.0" y="129.0" width="420.0" height="14" class="seg-ok"/>
<text x="628" y="140.0" class="small"><tspan class="libname ours">TomlBeef</tspan></text>
<text x="200.0" y="155.0" class="note-plain small" text-anchor="start">266 read correctly</text>
<rect x="200.0" y="160.0" width="172.1" height="14" class="seg-ok"/>
<rect x="372.1" y="160.0" width="50.5" height="14" class="seg-approx"/>
<rect x="422.6" y="160.0" width="6.3" height="14" class="seg-bad"/>
<rect x="428.9" y="160.0" width="191.1" height="14" class="seg-err"/>
<text x="628" y="171.0" class="small"><tspan class="libname">StructuredData</tspan></text>
<text x="200.0" y="186.0" class="note-plain small" text-anchor="start">109 read correctly · 32 dates as text or float32 · 4 wrong values · 121 error</text>
<line x1="40" y1="196.0" x2="880" y2="196.0" class="rule"/>
<text x="180.0" y="218.0" class="label" text-anchor="end">toml-test invalid files</text>
<text x="180.0" y="233.0" class="note-plain small" text-anchor="end">492 files</text>
<rect x="200.0" y="205.0" width="420.0" height="14" class="seg-ok"/>
<text x="628" y="216.0" class="small"><tspan class="libname ours">TomlBeef</tspan></text>
<text x="200.0" y="231.0" class="note-plain small" text-anchor="start">492 rejected</text>
<rect x="200.0" y="236.0" width="267.2" height="14" class="seg-ok"/>
<rect x="467.2" y="236.0" width="152.8" height="14" class="seg-bad"/>
<text x="628" y="247.0" class="small"><tspan class="libname">StructuredData</tspan></text>
<text x="200.0" y="262.0" class="note-plain small" text-anchor="start">313 rejected · 179 accepted</text>
<line x1="40" y1="272.0" x2="880" y2="272.0" class="rule"/>
<text x="180.0" y="294.0" class="label" text-anchor="end">real Beef project files</text>
<text x="180.0" y="309.0" class="note-plain small" text-anchor="end">134 files</text>
<rect x="200.0" y="281.0" width="416.9" height="14" class="seg-ok"/>
<rect x="616.9" y="281.0" width="3.1" height="14" class="seg-ok"/>
<text x="628" y="292.0" class="small"><tspan class="libname ours">TomlBeef</tspan></text>
<text x="200.0" y="307.0" class="note-plain small" text-anchor="start">133 read identically · 1 invalid file rejected</text>
<rect x="200.0" y="312.0" width="416.9" height="14" class="seg-ok"/>
<rect x="616.9" y="312.0" width="3.1" height="14" class="seg-bad"/>
<text x="628" y="323.0" class="small"><tspan class="libname">StructuredData</tspan></text>
<text x="200.0" y="338.0" class="note-plain small" text-anchor="start">133 read identically · 1 invalid file accepted</text>
<line x1="40" y1="348.0" x2="880" y2="348.0" class="rule"/>
<text x="40.0" y="366.0" class="footnote" text-anchor="start">StructuredData has no dotted keys, literal or multi-line strings; keeps dates as text, floats as 32-bit; does not check duplicate keys or UTF-8.</text>
<text x="40.0" y="384.0" class="footnote" text-anchor="start">Parsing rows marked "not like-for-like": StructuredData parses floats as float32 and leaves dates unparsed, so it does less work there.</text>
<text x="40.0" y="424.0" class="group" text-anchor="start">PARSING · MB/s, higher is better · bars scaled per row</text>
