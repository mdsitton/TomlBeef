    .rule { stroke: #d8dee4; stroke-width: 1; }
    .libname { fill: #656d76; }
    .libname.ours { fill: #c2410c; font-weight: 650; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
