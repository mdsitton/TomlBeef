<rect class="bg" x="0" y="0" width="920" height="1119" rx="10"/>
<text x="40.0" y="44.0" class="title" text-anchor="start">Average speed relative to TomlBeef</text>
<text x="40.0" y="66.0" class="subtitle" text-anchor="start">geometric mean over 10 inputs of each library's MB/s ÷ TomlBeef's · higher is better · TomlBeef = 1×</text>
